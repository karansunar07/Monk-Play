{% if first_playable_track %}
<section class="music-player" aria-label="Music player">
    <div class="player-now">
        <button id="close-player-btn" class="player-mini-btn" type="button" aria-label="Hide player">Close</button>
        {% if first_playable_track.playlist_image_url %}
        <img id="player-cover" class="player-cover" src="{{ first_playable_track.playlist_image_url }}" alt="">
        {% else %}
        <div id="player-cover" class="player-cover" aria-hidden="true">MP</div>
        {% endif %}
        <div>
            <strong id="player-title">{{ first_playable_track.track_name }}</strong>
            <span id="player-artist">{{ first_playable_track.artist_names or "Unknown artist" }}</span>
        </div>
        <button id="save-track-btn" class="player-mini-btn" type="button" aria-label="Save track">Save</button>
    </div>

    <div class="player-center">
        <div class="player-controls">
            <button id="shuffle-btn" type="button" aria-label="Shuffle">Shuffle</button>
            <button id="prev-btn" type="button" aria-label="Previous track">Prev</button>
            <button id="play-pause-btn" class="player-main-btn" type="button" aria-label="Play">Play</button>
            <button id="next-btn" type="button" aria-label="Next track">Next</button>
            <button id="repeat-btn" type="button" aria-label="Repeat">Repeat</button>
        </div>
        <div class="player-progress">
            <span id="current-time">0:00</span>
            <input id="progress-range" type="range" min="0" max="100" value="0" step="0.1" aria-label="Track progress">
            <span id="total-time">0:00</span>
        </div>
        <div id="player-embed-wrap" class="player-embed-wrap" hidden>
            <iframe
                id="player-spotify-embed"
                title="Spotify embedded player"
                loading="lazy"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            ></iframe>
        </div>
    </div>

    <div class="player-tools">
        <button id="mute-btn" type="button" aria-label="Mute">Vol</button>
        <input id="volume-range" type="range" min="0" max="1" value="0.8" step="0.01" aria-label="Volume">
    </div>

    <audio id="site-audio-player" preload="metadata"></audio>
</section>
{% endif %}
